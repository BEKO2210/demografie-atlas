name: Deploy Demografie Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Eine eigene Domain liefert von der Wurzel aus, die github.io-Projektseite
      # dagegen unter einem Unterpfad. Beides hängt an derselben Entscheidung,
      # deshalb steht sie an einer Stelle: der Repository-Variable SITE_DOMAIN.
      # Gesetzt → eigene Domain, leer → github.io.
      - name: Adresse bestimmen
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$SITE_DOMAIN" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_PLAUSIBLE_DOMAIN=$SITE_DOMAIN" >> "$GITHUB_ENV"
            echo "Ausgeliefert wird unter https://$SITE_DOMAIN"
          else
            # Die Reichweitenmessung läuft schon vor dem Domainwechsel und trägt
            # bereits den künftigen Namen — so muss die Seite in Plausible später
            # nicht umbenannt werden und die Zahlenreihe bricht nicht ab.
            echo "NEXT_PUBLIC_PLAUSIBLE_DOMAIN=demografie.it-handwerk-stuttgart.de" >> "$GITHUB_ENV"
            owner_lc=$(echo "$OWNER" | tr "[:upper:]" "[:lower:]")
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$owner_lc.github.io/$REPO_NAME" >> "$GITHUB_ENV"
            echo "Ausgeliefert wird unter https://$owner_lc.github.io/$REPO_NAME"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx next build

      # GitHub Pages liest die eigene Domain aus einer CNAME-Datei im Artefakt.
      - name: Eigene Domain hinterlegen
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > ./out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
